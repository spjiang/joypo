<!DOCTYPE HTML>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<meta name="MobileOptimized" content="240"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{content:title}-{pboot:sitetitle}</title>
<meta name="keywords" content="{content:keywords}">
<meta name="description" content="{content:description}">
<link rel="stylesheet" type="text/css" href="{pboot:sitedomain}/m/css/reset.css">
<link rel="stylesheet" type="text/css" href="{pboot:sitedomain}/m/css/style.css">
<link href="{pboot:sitedomain}/m/css/component.css" rel="stylesheet" type="text/css"/>
<script type="text/javascript" src="{pboot:sitedomain}/m/js/jquery.js"></script>
<script type="text/javascript" src="{pboot:sitedomain}/m/js/modernizr.custom.js"></script>
<script type="text/javascript" src="{pboot:sitedomain}/m/js/jquery.dlmenu.js"></script>
<script src="{pboot:sitedomain}/m/js/touchslide.1.1.js"></script>
<link href="{pboot:sitedomain}/m/css/swiper.min.css" rel="stylesheet" type="text/css"/>
<script src="{pboot:sitedomain}/m/js/swiper.min.js"></script>
<link rel="stylesheet" href="{pboot:sitedomain}/m/css/photoswipe.css">
<link rel="stylesheet" href="{pboot:sitedomain}/m/css/default-skin.css">
<script src="{pboot:sitedomain}/m/js/imgready.js"></script>
<script src="{pboot:sitedomain}/m/js/photoswipe.min.js"></script>
<script src="{pboot:sitedomain}/m/js/photoswipe-ui-default.min.js"></script>
<script src="{pboot:sitedomain}/m/js/photoswipe-4.0.8-run.js"></script>
</head>
<body>
{include file=head.html}
<div class="clear"></div>
<div class="width1004 n_weizhi">
  <div class="indexcontent"> {pboot:position}</div>
</div>
<div class="clear"></div>
<!-- 本例主要代码 Start ================================ -->
<div id="slideBox2" class="slideBox">
  <div class="bd">
    <ul>
      {pboot:pics id={content:id} num=10}
      <li><a class="pic"><img src="[pics:src]"/></a></li>
      {/pboot:pics}
    </ul>
  </div>
  <div class="hd">
    <ul>
    </ul>
  </div>
</div>
<script type="text/javascript">
	TouchSlide({ 
		slideCell:"#slideBox2",
		titCell:".hd ul", //开启自动分页 autoPage:true ，此时设置 titCell 为导航元素包裹层
		mainCell:".bd ul", 
		effect:"leftLoop", 
		autoPage:true,//自动分页
		autoPlay:true //自动播放
	});
</script> 
<!-- 本例主要代码 End ================================ -->
<div class="clear" style="height:10px;"></div>
<div class="indexcontent">
  <div class="p_i_txt">{content:title}</div>
</div>
<div class="clear" style="height:10px;"></div>
<div class="width1004 p_i_title">
  <div class="indexcontent">
    <div class="txt">产品参数</div>
  </div>
</div>
<div class="clear" style="height:10px;"></div>
<div class="indexcontent">
  <div class="content">
    {content:ext_canshu}
  </div>
</div>
<div class="clear" style="height:20px;"></div>
<div class="width1004 p_i_title">
  <div class="indexcontent">
    <div class="txt">产品详情</div>
  </div>
</div>
<div class="clear" style="height:10px;"></div>
<div class="indexcontent">
  <div class="content" id="maximg">
    {content:content}
  </div>
</div>
<div class="clear" style="height:20px;"></div>
<div class="clear"></div>
{include file=foot.html}
</body>
</html>

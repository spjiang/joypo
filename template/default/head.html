<!--Joypo 动效增强层：滚动载入 + 悬停动效（仅用 transform/opacity，不改布局）-->

<script>
    /* 移动端视口：本项目未做独立移动端模板，PC 模板靠整体缩放适配手机，
       因此保留 initial-scale=screen.width/1200 的缩放版 viewport。
       注意：缩放后浏览器视口逻辑宽度恒为 1200px，
       所以 max-width 媒体查询要按 1200px 断点来写，不能用 768px。 */
    (function () {
        var scale = Math.min(parseInt(window.screen.width, 10) / 1200, 1);
        var vp = document.createElement('meta');
        vp.name = 'viewport';
        vp.content = 'width=device-width, initial-scale=' + scale +
                     ', minimum-scale=' + scale + ', maximum-scale=' + scale + ', user-scalable=no';
        document.getElementsByTagName('head')[0].appendChild(vp);
    })();
</script>

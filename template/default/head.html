        <script type="text/javascript">
   function checktop(nForm){
   if(nForm.title.value=="Search")
   { alert("{fun=joypo_t('search.required')}");

   }
   }
   function checktop_en(nForm){

<div class="header_top_lan">
	<a class="{fun=joypo_lang_class('zh')}" href="{fun=joypo_lang_url('zh')}">{fun=joypo_t('nav.zh')}</a>
    <a class="{fun=joypo_lang_class('en')}" href="{fun=joypo_lang_url('en')}">EN</a>

    </header>
   <script>
        window.addEventListener('scroll',function(){
         tou = document.querySelector('.header-main');
            /*  tou.classList.toggle("bian",window.scrollY>0); */
           if(window.scrollY>80)
            {
                tou.classList.add("header-main01");
            }else{
                tou.classList.remove("header-main01");
            }
        })

        var navMq = window.matchMedia('(max-width: 1199px)');
        var siteHead = document.getElementById('header');
        var navToggle = siteHead.querySelector('.nav-toggle');
        var navBackdrop = siteHead.querySelector('.nav-backdrop');

        function setNavOpen(open) {
            siteHead.classList.toggle('is-nav-open', open);
            navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            navToggle.setAttribute('aria-label', open ? "{fun=joypo_t('nav.menu_close')}" : "{fun=joypo_t('nav.menu_open')}");
            document.body.classList.toggle('nav-locked', open);
        }

        function closeSubmenus() {
            var buttons = siteHead.querySelectorAll('.nav-sub-toggle');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].setAttribute('aria-expanded', 'false');
                buttons[i].setAttribute('aria-label', "{fun=joypo_t('nav.submenu_open')}");
                buttons[i].parentNode.classList.remove('is-sub-open');
            }
        }

        function closeNav() {
            setNavOpen(false);
            closeSubmenus();
        }

        navToggle.addEventListener('click', function () {
            if (!navMq.matches) return;
            setNavOpen(!siteHead.classList.contains('is-nav-open'));
        });
        navBackdrop.addEventListener('click', closeNav);

        var topItems = siteHead.querySelectorAll('.nav-lv1 > li');
        for (var n = 0; n < topItems.length; n++) {
            (function (li) {
                var subBtn = li.querySelector('.nav-sub-toggle');
                var topLink = li.querySelector('a');
                if (subBtn) {
                    subBtn.addEventListener('click', function (event) {
                        event.preventDefault();
                        event.stopPropagation();
                        if (!navMq.matches) return;
                        var open = li.classList.toggle('is-sub-open');
                        subBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                        subBtn.setAttribute('aria-label', open ? "{fun=joypo_t('nav.submenu_close')}" : "{fun=joypo_t('nav.submenu_open')}");
                    });
                } else if (topLink) {
                    topLink.addEventListener('click', function () {
                        if (navMq.matches) closeNav();
                    });
                }
                var subLinks = li.querySelectorAll('.cms-site-submenu a');
                for (var s = 0; s < subLinks.length; s++) {
                    subLinks[s].addEventListener('click', function () {
                        if (navMq.matches) closeNav();
                    });
                }
            })(topItems[n]);
        }

        function syncNavMode() {
            if (!navMq.matches) {
                closeNav();
                $('.cms-site-submenu').stop(true, true).css('display', '');
            }
        }
        if (navMq.addEventListener) {
            navMq.addEventListener('change', syncNavMode);
        } else if (navMq.addListener) {
            navMq.addListener(syncNavMode);
        }

        /* 宽屏下拉由样式的 :hover 控制，避免 fade 把菜单收成一条并写死 display。 */

        $(function () {
            $(".top_search").off("mouseenter mouseleave");
            $(".top_search").on("mouseenter", function () {
                if (navMq.matches) return;
                $(this).children(".search_con").stop().slideDown(300);
            }).on("mouseleave", function () {
                if (navMq.matches) return;
                $(this).children(".search_con").stop().slideUp(300);
            }).on("click", function (event) {
                if (!navMq.matches) return;
                if ($(event.target).closest("form").length) return;
                $(this).toggleClass("is-search-open");
            });
        });
    </script>

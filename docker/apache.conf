ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html
    PassEnv JOYPO_DB_TYPE JOYPO_DB_HOST JOYPO_DB_PORT JOYPO_DB_NAME JOYPO_DB_USER JOYPO_DB_PASSWORD

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html

        RewriteEngine On
        # 证书就绪后，正式域名从 HTTP 跳到 HTTPS。校验文件保持明文，方便续期。
        <IfModule mod_ssl.c>
            <IfFile /etc/letsencrypt/live/www.joypoenergy.com/fullchain.pem>
                RewriteCond %{HTTP_HOST} ^(www\.)?joypoenergy\.com$ [NC]
                RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
                RewriteRule ^ https://www.joypoenergy.com%{REQUEST_URI} [R=301,L]
            </IfFile>
        </IfModule>
        RewriteRule ^(data|static/backup)(/|$) - [F,L]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php?p=$1 [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
    <IfFile /etc/letsencrypt/live/www.joypoenergy.com/fullchain.pem>
        <VirtualHost *:443>
            ServerName www.joypoenergy.com
            ServerAlias joypoenergy.com
            DocumentRoot /var/www/html
            PassEnv JOYPO_DB_TYPE JOYPO_DB_HOST JOYPO_DB_PORT JOYPO_DB_NAME JOYPO_DB_USER JOYPO_DB_PASSWORD

            SSLEngine on
            SSLCertificateFile /etc/letsencrypt/live/www.joypoenergy.com/fullchain.pem
            SSLCertificateKeyFile /etc/letsencrypt/live/www.joypoenergy.com/privkey.pem

            <Directory /var/www/html>
                Options FollowSymLinks
                AllowOverride All
                Require all granted
                DirectoryIndex index.php index.html

                RewriteEngine On
                RewriteCond %{HTTP_HOST} ^joypoenergy\.com$ [NC]
                RewriteRule ^ https://www.joypoenergy.com%{REQUEST_URI} [R=301,L]
                RewriteRule ^(data|static/backup)(/|$) - [F,L]
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteRule ^(.*)$ index.php?p=$1 [QSA,L]
            </Directory>

            ErrorLog ${APACHE_LOG_DIR}/error.log
            CustomLog ${APACHE_LOG_DIR}/access.log combined
        </VirtualHost>
    </IfFile>
</IfModule>
